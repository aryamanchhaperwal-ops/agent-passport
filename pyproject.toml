# AgentPassport — Phase 1 (local reference implementation)

[project]
name = "agentpassport"
version = "0.1.0"
description = "Local cryptographic delegation and runtime authorization testbed for AI agents (Phase 1 security core)."
requires-python = ">=3.12"
dependencies = [
    "cryptography>=42.0",
    "fastapi>=0.110",
    "pydantic>=2.6",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
